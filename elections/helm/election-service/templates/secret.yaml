{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "election-service.fullname" . }}-secret
  labels:
    {{- include "election-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: {{ include "election-service.connectionString" . | quote }}
  {{- range $version, $key := .Values.secret.credentialHashKeys }}
  Voting__CredentialHashKeys__{{ $version }}: {{ required (printf "secret.credentialHashKeys.%s is required when secret.existingSecret is empty" $version) $key | quote }}
  {{- end }}
  Oidc__ClientSecret: {{ required "secret.oidcClientSecret is required when secret.existingSecret is empty" .Values.secret.oidcClientSecret | quote }}
{{- end }}
{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "election-service.fullname" . }}-postgres-secret
  labels:
    {{- include "election-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "postgresql.password is required when PostgreSQL is enabled" .Values.postgresql.password | quote }}
{{- end }}
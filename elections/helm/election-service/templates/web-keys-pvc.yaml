{{- if .Values.web.dataProtection.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "election-service.fullname" . }}-web-keys-pvc
  labels:
    {{- include "election-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  accessModes:
    - {{ .Values.web.dataProtection.accessMode }}
  {{- with .Values.web.dataProtection.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.web.dataProtection.storageSize }}
{{- end }}